<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="iiotShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff5eb"/>
    </linearGradient>
    <linearGradient id="iiotOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#b33600"/>
    </linearGradient>
    <linearGradient id="iiotDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Shield Boundary -->
  <path d="M 20,20 L 180,20 L 180,140 L 100,185 L 20,140 Z" fill="url(#iiotShield)" stroke="#1a202c" stroke-width="6" stroke-linejoin="round" />
  <path d="M 26,26 L 174,26 L 174,136 L 100,177 L 26,136 Z" fill="none" stroke="#ff6b00" stroke-width="2" stroke-linejoin="round" />

  <!-- NPTEL • IIT Kharagpur Header -->
  <text x="100" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#1a202c" text-anchor="middle" letter-spacing="1.5">IIT KHARAGPUR</text>
  <text x="100" y="54" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9" fill="#ff6b00" text-anchor="middle" letter-spacing="3">NPTEL</text>
  
  <!-- Divider -->
  <line x1="45" y1="62" x2="155" y2="62" stroke="#ff6b00" stroke-width="1.5" stroke-dasharray="2,2" />

  <!-- Core Graphic: Industry 4.0 Industrial Gear & Smart Signal Waves -->
  <g transform="translate(100, 95)">
    <!-- Gear structure -->
    <path d="M -24,-8 L -18,-14 L -8,-24 L 8,-24 L 18,-14 L 24,-8 L 24,8 L 18,14 L 8,24 L -8,24 L -18,14 L -24,8 Z" fill="none" stroke="#1a202c" stroke-width="2" />
    <!-- Gear teeth details -->
    <rect x="-6" y="-28" width="12" height="6" fill="#1a202c" rx="1" />
    <rect x="-6" y="22" width="12" height="6" fill="#1a202c" rx="1" />
    <rect x="-28" y="-6" width="6" height="12" fill="#1a202c" rx="1" />
    <rect x="22" y="-6" width="6" height="12" fill="#1a202c" rx="1" />
    
    <!-- Central Sensor core / IoT network nodes -->
    <circle cx="0" cy="0" r="15" fill="url(#iiotOrange)" />
    <!-- Factory outline inside -->
    <path d="M -8,5 L -8,-3 L -4,-1 L -4,-5 L 0,-3 L 0,-7 L 4,-5 L 8,-7 L 8,5 Z" fill="#ffffff" />
    
    <!-- Signal waves representing connectivity -->
    <path d="M -35,-25 C -45,-15 -45,15 -35,25" fill="none" stroke="#ff6b00" stroke-width="2" stroke-linecap="round" />
    <path d="M 35,-25 C 45,-15 45,15 35,25" fill="none" stroke="#ff6b00" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Title Text -->
  <text x="100" y="123" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#1a202c" text-anchor="middle" letter-spacing="0.5">INDUSTRY 4.0</text>
  <text x="100" y="135" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#4a5568" text-anchor="middle" letter-spacing="0.2">INDUSTRIAL IoT</text>

  <!-- Bottom Ribbon -->
  <path d="M 24,142 L 176,142 L 176,155 L 100,180 L 24,155 Z" fill="url(#iiotDark)" />
  <text x="100" y="161" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">TRAINED</text>
</svg>
