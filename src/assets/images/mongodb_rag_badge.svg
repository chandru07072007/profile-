<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Stylized card border and clipping mask path for the asymmetric corner -->
  <path d="M 120,10 
           L 350,10 
           A 40,40 0 0,1 390,50 
           L 390,350 
           A 40,40 0 0,1 350,390 
           L 50,390 
           A 40,40 0 0,1 10,350 
           L 10,120 
           C 10,60 60,10 120,10 Z" 
        fill="#e8fb9e" 
        stroke="#001e2b" 
        stroke-width="12" 
        stroke-linejoin="round" />
  
  <!-- Header Bar with same top-left asymmetric curve -->
  <path d="M 120,10 
           L 350,10 
           A 40,40 0 0,1 390,50 
           L 390,120 
           L 10,120 
           L 10,120 
           C 10,60 60,10 120,10 Z" 
        fill="#001e2b" />
  
  <!-- Header text: MongoDB Skill -->
  <text x="205" y="80" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="800" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">MongoDB Skill</text>
  
  <!-- Content text: "RAG with MongoDB" -->
  <text x="200" y="195" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700" font-size="32" fill="#001e2b" text-anchor="middle" letter-spacing="-0.5">RAG with</text>
  <text x="200" y="238" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="700" font-size="32" fill="#001e2b" text-anchor="middle" letter-spacing="-0.5">MongoDB</text>
  
  <!-- Trophy Cup Icon Group -->
  <g transform="translate(130, 255)">
    <!-- Side handles (left & right) -->
    <path d="M 20,30 C 0,30 0,55 20,55" fill="none" stroke="#001e2b" stroke-width="3" stroke-linecap="round" />
    <path d="M 120,30 C 140,30 140,55 120,55" fill="none" stroke="#001e2b" stroke-width="3" stroke-linecap="round" />
    
    <!-- Main cup body with green fill -->
    <path d="M 20,10 
             L 120,10 
             C 120,55 105,75 70,75 
             C 35,75 20,55 20,10 Z" 
          fill="#00e676" 
          stroke="#001e2b" 
          stroke-width="3" 
          stroke-linejoin="round" />
    
    <!-- Yellow Star inside the cup -->
    <path d="M 70,22 
             L 74,32 
             L 84,33 
             L 76,40 
             L 79,50 
             L 70,44 
             L 61,50 
             L 64,40 
             L 56,33 
             L 66,32 Z" 
          fill="#e8fb9e" 
          stroke="#001e2b" 
          stroke-width="2" 
          stroke-linejoin="round" />
    
    <!-- Stand stem -->
    <line x1="70" y1="75" x2="70" y2="100" stroke="#001e2b" stroke-width="3" />
    
    <!-- Stand base -->
    <path d="M 40,115 C 40,102 100,102 100,115 Z" fill="#e8fb9e" stroke="#001e2b" stroke-width="3" stroke-linejoin="round" />
  </g>
</svg>
