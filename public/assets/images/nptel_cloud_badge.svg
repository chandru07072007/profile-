<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Outer Ornate Shield/Hexagon frame -->
  <polygon points="200,15 370,110 370,290 200,385 30,290 30,110" 
           fill="#fbfbf9" 
           stroke="#8b0000" 
           stroke-width="12" 
           stroke-linejoin="round" />
  
  <polygon points="200,28 352,116 352,284 200,372 48,284 48,116" 
           fill="none" 
           stroke="#d4af37" 
           stroke-width="4" 
           stroke-linejoin="round" />

  <!-- Upper Banner Area -->
  <path d="M 110,32 Q 200,50 290,32 L 350,116 L 50,116 Z" fill="#8b0000" opacity="0.95" />
  <text x="200" y="85" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="1">NPTEL</text>
  
  <!-- Elite Tag Banner overlay -->
  <g transform="translate(140, 105)">
    <rect x="0" y="0" width="120" height="32" rx="4" fill="#d4af37" stroke="#8b0000" stroke-width="2" />
    <text x="60" y="22" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="900" font-size="16" fill="#8b0000" text-anchor="middle" letter-spacing="2">ELITE</text>
  </g>
  
  <!-- Course Name Core Content -->
  <text x="200" y="195" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="800" font-size="34" fill="#0c2340" text-anchor="middle" letter-spacing="-0.5">CLOUD</text>
  <text x="200" y="235" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="800" font-size="34" fill="#0c2340" text-anchor="middle" letter-spacing="-0.5">COMPUTING</text>
  
  <!-- Sub-details / Issuer -->
  <text x="200" y="275" font-family="'Inter', sans-serif" font-weight="600" font-size="15" fill="#8b0000" text-anchor="middle" letter-spacing="0.5">IIT KHARAGPUR</text>
  
  <!-- Ribbon Badge Seal Group -->
  <g transform="translate(135, 290)">
    <!-- Hanging Ribbons -->
    <path d="M 50,45 L 30,95 L 55,95 L 65,45 Z" fill="#0c2340" />
    <path d="M 80,45 L 100,95 L 75,95 L 65,45 Z" fill="#0c2340" />

    <!-- Silver/Blue Medal circle (Elite Silver representation!) -->
    <circle cx="65" cy="40" r="30" fill="#c0c0c0" stroke="#d4af37" stroke-width="3" />
    <circle cx="65" cy="40" r="23" fill="#ffffff" stroke="#0c2340" stroke-width="1.5" />
    
    <!-- Central NPTEL Atomic Orbits SVG symbol -->
    <g transform="translate(53, 28)" stroke="#8b0000" stroke-width="1.5" fill="none">
      <ellipse cx="12" cy="12" rx="11" ry="4" transform="rotate(30 12 12)" />
      <ellipse cx="12" cy="12" rx="11" ry="4" transform="rotate(90 12 12)" />
      <ellipse cx="12" cy="12" rx="11" ry="4" transform="rotate(150 12 12)" />
      <circle cx="12" cy="12" r="2.5" fill="#d4af37" stroke="none" />
    </g>
  </g>
</svg>
