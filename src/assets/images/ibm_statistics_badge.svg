<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Definitions for gradients and styles -->
  <defs>
    <linearGradient id="ibmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f4f8"/>
    </linearGradient>
    <linearGradient id="ibmBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f62fe"/>
      <stop offset="100%" stop-color="#001d6c"/>
    </linearGradient>
    <linearGradient id="darkGray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#393939"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Shield Boundary -->
  <path d="M 20,20 L 180,20 L 180,140 L 100,185 L 20,140 Z" fill="url(#ibmBg)" stroke="#0f62fe" stroke-width="6" stroke-linejoin="round" />
  <path d="M 26,26 L 174,26 L 174,136 L 100,177 L 26,136 Z" fill="none" stroke="#002d9c" stroke-width="2" stroke-linejoin="round" />

  <!-- IBM 8-Bar Logo styled vector -->
  <g transform="translate(68, 38)">
    <!-- Striped letter I -->
    <rect x="0" y="0" width="12" height="2" fill="#0f62fe" />
    <rect x="0" y="3" width="12" height="2" fill="#0f62fe" />
    <rect x="0" y="6" width="12" height="2" fill="#0f62fe" />
    <rect x="0" y="9" width="12" height="2" fill="#0f62fe" />
    <rect x="0" y="12" width="12" height="2" fill="#0f62fe" />
    <rect x="0" y="15" width="12" height="2" fill="#0f62fe" />
    <rect x="0" y="18" width="12" height="2" fill="#0f62fe" />
    <rect x="0" y="21" width="12" height="2" fill="#0f62fe" />

    <!-- Striped letter B -->
    <path d="M 18,0 H 32 A 4,4 0 0,1 36,4 A 4,4 0 0,1 32,8 H 18 Z" fill="none" stroke="#0f62fe" stroke-width="2" stroke-dasharray="12,1" />
    <path d="M 18,8 H 32 A 4,4 0 0,1 36,12 A 4,4 0 0,1 32,16 H 18 Z" fill="none" stroke="#0f62fe" stroke-width="2" stroke-dasharray="12,1" />
    <!-- Filled B lines -->
    <rect x="18" y="0" width="16" height="2" fill="#0f62fe" />
    <rect x="18" y="3" width="18" height="2" fill="#0f62fe" />
    <rect x="18" y="6" width="18" height="2" fill="#0f62fe" />
    <rect x="18" y="9" width="18" height="2" fill="#0f62fe" />
    <rect x="18" y="12" width="18" height="2" fill="#0f62fe" />
    <rect x="18" y="15" width="18" height="2" fill="#0f62fe" />
    <rect x="18" y="18" width="18" height="2" fill="#0f62fe" />
    <rect x="18" y="21" width="16" height="2" fill="#0f62fe" />

    <!-- Striped letter M -->
    <rect x="42" y="0" width="22" height="2" fill="#0f62fe" />
    <rect x="42" y="3" width="5" height="2" fill="#0f62fe" /><rect x="50" y="3" width="6" height="2" fill="#0f62fe" /><rect x="59" y="3" width="5" height="2" fill="#0f62fe" />
    <rect x="42" y="6" width="5" height="2" fill="#0f62fe" /><rect x="49" y="6" width="8" height="2" fill="#0f62fe" /><rect x="59" y="6" width="5" height="2" fill="#0f62fe" />
    <rect x="42" y="9" width="5" height="2" fill="#0f62fe" /><rect x="49" y="9" width="8" height="2" fill="#0f62fe" /><rect x="59" y="9" width="5" height="2" fill="#0f62fe" />
    <rect x="42" y="12" width="5" height="2" fill="#0f62fe" /><rect x="48" y="12" width="10" height="2" fill="#0f62fe" /><rect x="59" y="12" width="5" height="2" fill="#0f62fe" />
    <rect x="42" y="15" width="5" height="2" fill="#0f62fe" /><rect x="48" y="15" width="10" height="2" fill="#0f62fe" /><rect x="59" y="15" width="5" height="2" fill="#0f62fe" />
    <rect x="42" y="18" width="5" height="2" fill="#0f62fe" /><rect x="59" y="18" width="5" height="2" fill="#0f62fe" />
    <rect x="42" y="21" width="5" height="2" fill="#0f62fe" /><rect x="59" y="21" width="5" height="2" fill="#0f62fe" />
  </g>

  <!-- Divider -->
  <line x1="45" y1="68" x2="155" y2="68" stroke="#0f62fe" stroke-width="1.5" />

  <!-- Core Graphic: Statistical Normal Distribution Curve & Bar Chart -->
  <g transform="translate(100, 100)">
    <!-- Bar Chart Elements -->
    <rect x="-35" y="-12" width="10" height="22" fill="#e0e0e0" rx="1" />
    <rect x="-21" y="-24" width="10" height="34" fill="#0f62fe" rx="1" />
    <rect x="-7" y="-36" width="10" height="46" fill="url(#ibmBlue)" rx="1" />
    <rect x="7" y="-28" width="10" height="38" fill="#0f62fe" rx="1" />
    <rect x="21" y="-16" width="10" height="26" fill="#e0e0e0" rx="1" />

    <!-- Bell Curve Overlay Line -->
    <path d="M -45,10 C -25,10 -20,-42 0,-42 C 20,-42 25,10 45,10" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round" />
    
    <!-- Data Points -->
    <circle cx="0" cy="-42" r="4" fill="#002d9c" />
    <circle cx="-21" cy="-24" r="3.5" fill="#161616" />
    <circle cx="21" cy="-16" r="3.5" fill="#161616" />
  </g>

  <!-- Title Text -->
  <text x="100" y="123" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#161616" text-anchor="middle" letter-spacing="1">SPSS STATISTICS</text>
  <text x="100" y="135" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#525252" text-anchor="middle" letter-spacing="0.5">DATA ANALYSIS CERTIFIED</text>

  <!-- Bottom TRAINED Ribbon -->
  <path d="M 24,142 L 176,142 L 176,155 L 100,180 L 24,155 Z" fill="url(#ibmBlue)" />
  <text x="100" y="161" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="3">VERIFIED</text>
</svg>
