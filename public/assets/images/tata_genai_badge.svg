<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4f8"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00539b"/>
      <stop offset="100%" stop-color="#002d62"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a3e0"/>
      <stop offset="100%" stop-color="#00539b"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Shield Boundary -->
  <path d="M 20,20 L 180,20 L 180,140 L 100,185 L 20,140 Z" fill="url(#shieldGrad)" stroke="#002d62" stroke-width="6" stroke-linejoin="round" />
  <path d="M 26,26 L 174,26 L 174,136 L 100,177 L 26,136 Z" fill="none" stroke="#00a3e0" stroke-width="2" stroke-linejoin="round" />

  <!-- TATA Brand Header -->
  <text x="100" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#002d62" text-anchor="middle" letter-spacing="4">TATA</text>
  
  <!-- Divider -->
  <line x1="45" y1="62" x2="155" y2="62" stroke="#002d62" stroke-width="1.5" stroke-dasharray="2,2" />

  <!-- Icon / Core graphic: AI Node / Data Analytics Graph -->
  <g transform="translate(100, 92)">
    <!-- Central Node -->
    <circle cx="0" cy="-5" r="14" fill="url(#blueGrad)" />
    <!-- Connected data nodes -->
    <line x1="0" y1="-5" x2="-28" y2="-15" stroke="#00a3e0" stroke-width="2" />
    <line x1="0" y1="-5" x2="28" y2="-15" stroke="#00a3e0" stroke-width="2" />
    <line x1="0" y1="-5" x2="-20" y2="15" stroke="#00a3e0" stroke-width="2" />
    <line x1="0" y1="-5" x2="20" y2="15" stroke="#00a3e0" stroke-width="2" />
    
    <circle cx="-28" cy="-15" r="5" fill="#00a3e0" />
    <circle cx="28" cy="-15" r="5" fill="#00a3e0" />
    <circle cx="-20" cy="15" r="6" fill="#00539b" />
    <circle cx="20" cy="15" r="6" fill="#00539b" />
    
    <!-- Pulse ring -->
    <circle cx="0" cy="-5" r="19" fill="none" stroke="#00a3e0" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8" />
  </g>

  <!-- Title Text -->
  <text x="100" y="120" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#002d62" text-anchor="middle" letter-spacing="0.5">GenAI POWERED</text>
  <text x="100" y="133" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#002d62" text-anchor="middle" letter-spacing="0.5">DATA ANALYTICS</text>

  <!-- Bottom TRAINED Ribbon -->
  <path d="M 24,142 L 176,142 L 176,155 L 100,180 L 24,155 Z" fill="url(#blueGrad)" />
  <text x="100" y="161" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="3">TRAINED</text>
</svg>
